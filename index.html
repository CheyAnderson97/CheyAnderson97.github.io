<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheyenne Anderson - ePortfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { height: 100%; width: 100%; background-color: #1a1a1a; color: #ffffff; }

        /* Navigation Bar */
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%;
            background-color: #232323; display: flex; justify-content: space-between;
            align-items: center; padding: 15px 40px; z-index: 1000;
            border-bottom: 1px solid #333333;
        }
        .navbar .logo { color: #ffffff; font-size: 1.3rem; font-weight: 700; text-transform: uppercase; }
        .navbar ul { display: flex; list-style: none; align-items: center; gap: 20px; }
        .navbar ul li a {
            color: #cccccc; text-decoration: none; font-size: 0.9rem;
            font-weight: 600; text-transform: uppercase; transition: color 0.3s ease;
        }
        .navbar ul li a:hover { color: #ffffff; }

        .btn-nav-first {
            background-color: #cbb280; color: #232323 !important;
            padding: 8px 18px; border-radius: 3px; font-weight: 700 !important;
        }
        .btn-nav-outline {
            border: 2px solid #ffffff; padding: 8px 18px; border-radius: 3px; color: #ffffff !important;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(40, 50, 60, 0.65), rgba(40, 50, 60, 0.65)), 
                        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 0 20px;
        }
        .hero h1 { color: #ffffff; font-size: 3.8rem; font-weight: 800; margin-bottom: 20px; text-transform: uppercase; }
        .hero p { color: #f0f0f0; font-size: 1.25rem; font-style: italic; max-width: 800px; line-height: 1.6; margin-bottom: 35px; }
        .hero-buttons { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .btn-hero-primary {
            background-color: #cbb280; color: #232323; padding: 14px 32px;
            text-decoration: none; font-weight: 700; text-transform: uppercase; border-radius: 3px;
        }
        .btn-hero-secondary {
            border: 2px solid #ffffff; color: #ffffff; padding: 14px 32px;
            text-decoration: none; font-weight: 700; text-transform: uppercase; border-radius: 3px;
        }
        .btn-hero-secondary:hover { background-color: #ffffff; color: #232323; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">CHEYENNE ANDERSON</div>
        <ul>
            <li><a href="about.html" class="btn-nav-first">About Me</a></li>
            <li><a href="index.html">Overview</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="https://github.com/CheyAnderson97" target="_blank" class="btn-nav-outline">View Code</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h1>CHEYENNE ANDERSON</h1>
        <p>Computer Science ePortfolio & Software Engineering Showcase</p>
        <div class="hero-buttons">
            <a href="about.html" class="btn-hero-primary">READ ABOUT ME</a>
            <a href="projects.html" class="btn-hero-secondary">VIEW CODING PROJECTS</a>
        </div>
    </section>

</body>
</html>
